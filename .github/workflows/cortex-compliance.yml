name: Cortex-Compliance Agentic RAG

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  issues:
    types: [opened, edited]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compliance-audit:
    name: Agentic RAG Verification & Auto-Patch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Dependencies
        run: |
          uv sync --extra dev

      - name: Setup Local Ollama Engine
        run: |
          echo "Installing local Ollama binary..."
          curl -fsSL https://ollama.com/install.sh | sh
          echo "Starting Ollama daemon..."
          ollama serve &
          # Wait for Ollama service to become healthy
          for i in {1..15}; do
            if curl -s http://localhost:11434/api/tags > /dev/null; then
              echo "Ollama is ready."
              break
            fi
            sleep 2
          done
          echo "Pulling embedding model..."
          ollama pull nomic-embed-text || true

      - name: Run Cortex-Compliance LangGraph Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          source .venv/bin/activate
          python -m cortex_rag.compliance_agent

      - name: Post 1-Click Code Patches & Regulatory Review
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          source .venv/bin/activate
          python -m cortex_rag.github_pr_bot dashboard/assets/latest_audit.json

      - name: Commit Updated Audit Snapshot & LanceDB Memory
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/assets/latest_audit.json .lancedb || true
          if git diff --staged --quiet; then
            echo "No telemetry changes to commit."
          else
            git commit -m "chore(compliance): sync latest audit telemetry and LanceDB memory [skip ci]"
            git push origin main
          fi

      - name: Upload Audit Telemetry Artifact
        uses: actions/upload-artifact@v4
        with:
          name: latest-compliance-audit
          path: dashboard/assets/latest_audit.json
