name: Build Cortex-Compliance Command Center (Flutter WASM)

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "flutter-build"
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package Flutter WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd dashboard
          flutter pub get

      - name: Build Flutter Web (WASM)
        run: |
          cd dashboard
          REPO_NAME="${{ github.event.repository.name }}"
          flutter build web --wasm --base-href "/${REPO_NAME}/"

      - name: Upload Flutter Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-wasm-dashboard
          path: dashboard/build/web
