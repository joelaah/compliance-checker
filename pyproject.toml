[project]
name = "cortex-compliance"
version = "0.1.0"
description = "Polyglot, Self-Healing Agentic RAG Compliance Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Cortex-Compliance Team", email = "security@cortexcompliance.dev" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "lancedb>=0.15.0",
    "supabase>=2.3.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
cortex = "cortex_rag.compliance_agent:cli_main"
cortex-mcp = "cortex_rag.mcp_server:main"
cortex-scan = "cortex_rag.stage1_scanner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cortex_rag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
